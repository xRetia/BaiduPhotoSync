<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>同步结果</title>
  <link rel="stylesheet" href="sync-result.css">
</head>
<body>
  <div id="result-app">
    <header id="result-header">
      <h1>同步结果</h1>
    </header>
    <div id="result-summary"></div>
    <div id="result-detail-wrapper">
      <div class="detail-header">详情</div>
      <div id="result-detail"></div>
    </div>
    <footer id="result-footer">
      <button id="btnCopy" class="btn-secondary">复制结果</button>
      <button id="btnOk" class="btn-primary">确定</button>
    </footer>
  </div>
  <script src="sync-result.js"></script>
</body>
</html>
